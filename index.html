<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tile Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{
  min-height:100vh;
  background:
    radial-gradient(circle at 30% 20%, #166534, transparent 50%),
    radial-gradient(circle at 70% 80%, #14532d, transparent 50%),
    #052e16;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}
h1{
  margin:10px 0;
  font-size:28px;
  letter-spacing:6px;
  color:#bbf7d0;
  text-shadow:0 0 15px #22c55e;
}
.subtitle{color:#86efac;font-size:14px;margin-bottom:10px;opacity:0.8}

#board{
  position:relative;
  width:340px;
  height:280px;
  margin:15px 0;
}
.tile{
  position:absolute;
  width:58px;
  height:58px;
  border-radius:12px;
  background:linear-gradient(145deg,#fffbeb,#fde68a);
  border:2px solid #fff;
  box-shadow:
    0 6px 14px rgba(0,0,0,0.45),
    inset 0 1px 0 rgba(255,255,255,0.8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  cursor:pointer;
  transition:transform 0.2s, opacity 0.2s;
  user-select:none;
}
.tile:hover{transform:translateY(-5px) scale(1.05)}
.tile.blocked{
  opacity:0.4;
  cursor:not-allowed;
  filter:brightness(0.6);
}
.tile.removed{
  transition:all 0.3s;
  transform:scale(0);
  opacity:0;
  pointer-events:none;
}

#tray{
  display:flex;
  gap:8px;
  padding:12px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:16px;
  min-height:64px;
  margin:10px 0;
}
.tray-slot{
  width:58px;height:58px;
  border-radius:12px;
  background:rgba(0,0,0,0.25);
  border:2px dashed rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  font-size:30px;
}
#message{
  min-height:32px;
  font-size:20px;
  margin:8px 0;
  font-weight:bold;
}
.win{color:#4ade80;text-shadow:0 0 10px #4ade80}
.lose{color:#f87171;text-shadow:0 0 10px #f87171}

.controls{display:flex;gap:12px;margin-top:10px}
button{
  padding:12px 26px;
  border:none;border-radius:12px;
  background:linear-gradient(135deg,#22c55e,#15803d);
  color:#fff;
  font-size:15px;font-weight:bold;cursor:pointer;
  box-shadow:0 4px 12px rgba(34,197,94,0.4);
}
button:hover{transform:translateY(-2px)}
.hint{color:#86efac;font-size:13px;margin-top:16px;opacity:0.7;text-align:center;line-height:1.6}
</style>
</head>
<body>
<h1>🎮 TILE MATCH</h1>
<div class="subtitle">Click an uncovered tile to move it to the tray. Match 3 to clear!</div>

<div id="board"></div>
<div id="tray"></div>
<div id="message"></div>
<div class="controls">
  <button id="resetBtn">🔄 New Game</button>
</div>
<div class="hint">
  ✨ Bright tiles are clickable · Dim tiles are covered<br>
  🎯 Fill the tray with 3 identical tiles to clear them · Tray of 7 = Game Over
</div>

<script>
const SYMBOLS = ['🍎','🍊','🍋','🍇','🍉','🍓'];
const TILE = 58;
const TRAY_MAX = 7;

let tiles = [];
let tray = [];
let gameOver = false;

const board = document.getElementById('board');
const trayEl = document.getElementById('tray');
const message = document.getElementById('message');

// 每层牌的位置（故意错开、重叠，制造叠牌感）
// 第0层（底层）：4列 x 3行
const LAYER0_POS = [
  [0,0],[1,0],[2,0],[3,0],
  [0,1],[1,1],[2,1],[3,1],
  [0,2],[1,2],[2,2],[3,2]
];
// 第1层（上层）：压在底层牌上面，位置偏移一点，制造叠放感
const LAYER1_POS = [
  [1,0],[2,0],
  [0,1],[2,1],
  [1,2],[2,2]
];

function initGame(){
  // 6种牌，每种3张 = 18张
  let bag = [];
  SYMBOLS.forEach(s => { for(let i=0;i<3;i++) bag.push(s); });
  bag.sort(() => Math.random() - 0.5);

  tiles = [];
  tray = [];
  gameOver = false;
  message.textContent = '';
  message.className = '';

  let idx = 0;
  // 底层12张
  LAYER0_POS.forEach(([c,r]) => {
    tiles.push({
      id: idx,
      symbol: bag[idx++],
      layer: 0,
      col: c, row: r,
      removed: false
    });
  });
  // 上层6张
  LAYER1_POS.forEach(([c,r]) => {
    tiles.push({
      id: idx,
      symbol: bag[idx++],
      layer: 1,
      col: c, row: r,
      removed: false
    });
  });

  render();
}

// 判断牌是否被上层压住（重叠范围超过一半就算压住）
function isClickable(tile){
  if(tile.removed) return false;
  for(let other of tiles){
    if(other.removed) continue;
    if(other.layer <= tile.layer) continue;
    // 上层牌和这张牌位置重叠（同列同行，或相邻）
    if(Math.abs(other.col - tile.col) <= 0 && Math.abs(other.row - tile.row) <= 0){
      return false;
    }
  }
  return true;
}

function onTileClick(tile){
  if(gameOver) return;
  if(!isClickable(tile)) return;

  tile.removed = true;
  tray.push(tile.symbol);

  // 消除3张相同
  let count = {};
  tray.forEach(s => count[s] = (count[s]||0)+1);
  let kept = {};
  tray.forEach(s => kept[s] = (kept[s]||0)+1);
  tray = [];
  Object.keys(kept).forEach(s => {
    let n = kept[s];
    if(n >= 3) n -= 3;
    for(let i=0;i<n;i++) tray.push(s);
  });

  render();
  checkWinLose();
}

function checkWinLose(){
  let remaining = tiles.filter(t => !t.removed).length;
  if(remaining === 0){
    message.textContent = '🎉 YOU WIN!';
    message.className = 'win';
    gameOver = true;
    return;
  }
  if(tray.length >= TRAY_MAX){
    message.textContent = '💥 GAME OVER! Tray is full!';
    message.className = 'lose';
    gameOver = true;
  }
}

function render(){
  board.innerHTML = '';
  tiles.forEach(tile => {
    const el = document.createElement('div');
    el.className = 'tile';
    // 位置：底层整齐排，上层稍微偏移4px，露出下面牌的边
    let offsetX = tile.layer === 1 ? 6 : 0;
    let offsetY = tile.layer === 1 ? 6 : 0;
    el.style.left = tile.col * (TILE + 6) + offsetX + 'px';
    el.style.top = tile.row * (TILE + 6) + offsetY + 'px';
    el.style.zIndex = tile.layer * 10 + tile.id;
    el.textContent = tile.symbol;
    if(tile.removed) el.classList.add('removed');
    else if(!isClickable(tile)) el.classList.add('blocked');
    el.onclick = () => onTileClick(tile);
    board.appendChild(el);
  });

  trayEl.innerHTML = '';
  for(let i=0;i<TRAY_MAX;i++){
    const slot = document.createElement('div');
    slot.className = 'tray-slot';
    slot.textContent = tray[i] || '';
    trayEl.appendChild(slot);
  }
}

document.getElementById('resetBtn').onclick = initGame;
initGame();
</script>
</body>
</html>
