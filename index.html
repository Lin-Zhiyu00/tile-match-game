<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tile Match Celebration</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(191, 219, 254, 0.9), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(125, 186, 252, 0.8), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(147, 187, 253, 0.9), transparent 40%),
      linear-gradient(135deg, #7dd3fc 0%, #bae6fd 45%, #bae6fd 100%);
    color: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 34px;
    letter-spacing: 8px;
    color: #0369a1;
    text-shadow:
      0 0 12px rgba(255,255,255,0.9),
      0 0 24px rgba(56, 189, 248, 0.6);
    margin-bottom: 8px;
  }
  .subtitle {
    color: #075985;
    font-size: 14px;
    margin-bottom: 18px;
    opacity: 0.85;
    text-align: center;
    line-height: 1.5;
  }
  #board {
    position: relative;
    width: 460px;
    height: 370px;
    margin: 10px 0 18px;
    border-radius: 28px;
    background:
      radial-gradient(circle at center, rgba(255,255,255,0.6), rgba(186,230,253,0.4));
    border: 1px solid rgba(255,255,255,0.6);
    box-shadow:
      0 20px 50px rgba(14, 116, 144, 0.25),
      inset 0 0 40px rgba(255,255,255,0.7);
    overflow: hidden;
    z-index: 2;
  }
  #board::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
    pointer-events: none;
  }
  .tile {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 16px;
    background: linear-gradient(145deg, #ffffff 0%, #e0f2fe 50%, #7dd3fc 100%);
    border: 2px solid rgba(255,255,255,0.9);
    box-shadow:
      0 10px 24px rgba(14, 116, 144, 0.35),
      inset 0 0 0 1px rgba(255,255,255,0.6),
      inset 0 6px 12px rgba(255,255,255,0.8);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.25;
    user-select: none;
  }
  .tile:hover {
    transform: translateY(-6px) scale(1.06);
    box-shadow:
      0 18px 32px rgba(14, 116, 144, 0.45),
      0 0 20px rgba(255,255,255,0.9);
  }
  .tile.blocked {
    opacity: 0.35;
    cursor: not-allowed;
    filter: brightness(0.75) saturate(0.6);
  }
  .tile.removed {
    transition: all 0.35s cubic-bezier(0.2,0.7,0.3,1);
    transform: scale(0.2) rotate(180deg);
    opacity: 0;
    pointer-events: none;
  }
  #tray {
    display: flex;
    gap: 10px;
    padding: 14px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 22px;
    min-height: 72px;
    margin: 10px 0 14px;
    box-shadow: 0 12px 30px rgba(14,116,144,0.25);
    backdrop-filter: blur(6px);
    z-index: 2;
    position: relative;
  }
  .tray-slot {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: rgba(255,255,255,0.7);
    border: 2px dashed rgba(56,189,248,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  #message {
    min-height: 34px;
    font-size: 22px;
    margin: 4px 0 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-align: center;
    z-index: 2;
    position: relative;
  }
  .win {
    color: #059669;
    text-shadow: 0 0 12px rgba(255,255,255,0.9), 0 0 24px rgba(52,211,153,0.8);
  }
  .lose {
    color: #dc2626;
    text-shadow: 0 0 12px rgba(255,255,255,0.9), 0 0 24px rgba(248,113,113,0.8);
  }
  .controls {
    display: flex;
    gap: 14px;
    margin-top: 4px;
    position: relative;
    z-index: 10;
  }
  button {
    padding: 14px 30px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 10px 24px rgba(14,116,144,0.45);
    transition: 0.25s;
    position: relative;
    z-index: 10;
  }
  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 32px rgba(14,116,144,0.55);
  }
  .hint {
    color: #075985;
    font-size: 13px;
    margin-top: 20px;
    opacity: 0.8;
    text-align: center;
    line-height: 1.6;
    z-index: 2;
    position: relative;
  }
  #fireworks {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  .falling-fruit {
    position: fixed;
    top: -60px;
    font-size: 42px;
    pointer-events: none;
    z-index: 1;
    animation: fruitFall linear forwards;
    filter: drop-shadow(0 6px 10px rgba(14, 116, 144, 0.35));
  }
  @keyframes fruitFall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    100% {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0.9;
    }
  }
  .bounce-fruit {
    position: absolute;
    bottom: 20px;
    font-size: 48px;
    animation: bounceFruit 2.4s ease-in-out infinite;
    z-index: 1;
    filter: drop-shadow(0 8px 12px rgba(14, 116, 144, 0.35));
  }
  @keyframes bounceFruit {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-18px) scale(1.08); }
  }
  .fw-particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    animation: fwFly 1.6s ease-out forwards;
  }
  @keyframes fwFly {
    0% {
      transform: translate(0,0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--tx), var(--ty)) scale(0.2);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <h1>🎆 TILE MATCH 🎆</h1>
  <div class="subtitle">
    Click bright uncovered tiles to send them to the tray<br>
    Match 3 identical fruits to clear them, clear all to win!
  </div>
  <div id="board"></div>
  <div id="tray"></div>
  <div id="message"></div>
  <div class="controls">
    <button id="resetBtn">🔄 NEW GAME</button>
  </div>
  <div class="hint">
    ✨ Bright tiles can be clicked. Dim tiles are blocked.<br>
    🎯 3 matching fruits clear automatically. 7 fruits = game over.
  </div>

  <div class="bounce-fruit" style="left: 8%; animation-delay: 0s;">🍎</div>
  <div class="bounce-fruit" style="right: 12%; animation-delay: 0.4s;">🍇</div>
  <div class="bounce-fruit" style="left: 30%; animation-delay: 0.8s;">🍋</div>
  <div class="bounce-fruit" style="right: 30%; animation-delay: 1.2s;">🍊</div>
  <div class="bounce-fruit" style="left: 55%; animation-delay: 1.6s;">🍉</div>
  <div class="bounce-fruit" style="right: 55%; animation-delay: 2s;">🍓</div>

  <canvas id="fireworks"></canvas>

  <!-- 背景音乐 -->
  <audio id="bgm" loop preload="auto">
    <source src="bgm.mp3" type="audio/mpeg">
  

<script>
  const SYMBOLS = ['🍎', '🍊', '🍋', '🍇', '🍉', '🍓'];
  const TILE_SIZE = 60;
  const GAP = 8;
  const TRAY_MAX = 7;

  const COLS = 5;
  const ROWS = 4;
  const GRID_W = COLS * (TILE_SIZE + GAP) - GAP;
  const GRID_H = ROWS * (TILE_SIZE + GAP) - GAP;
  const PAD_X = (460 - GRID_W) / 2;
  const PAD_Y = (370 - GRID_H) / 2;

  let tiles = [];
  let tray = [];
  let gameOver = false;
  let fireworksRunning = false;
  let fallInterval;
  let bgmStarted = false;

  const boardEl = document.getElementById('board');
  const trayEl = document.getElementById('tray');
  const messageEl = document.getElementById('message');
  const resetBtn = document.getElementById('resetBtn');
  const canvas = document.getElementById('fireworks');
  const ctx = canvas.getContext('2d');
  const bgm = document.getElementById('bgm');
  bgm.volume = 0.22;

  // 第一次页面点击触发BGM
  document.body.addEventListener('click', ()=>{
    if(!bgmStarted){
      bgm.play().catch(e=>{});
      bgmStarted = true;
    }
  }, {once:true})

  const LAYER0_POS = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      LAYER0_POS.push([c, r]);
    }
  }
  const LAYER1_POS = [
    [1, 0], [2, 0], [3, 0],
    [0, 1], [2, 1], [4, 1],
    [1, 2], [2, 2], [3, 2],
    [0, 3], [2, 3], [4, 3]
  ];

  function shuffle(arr){
    const a = [...arr];
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function initGame(){
    // 停止旧烟花
    fireworksRunning = false;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // 清空降落定时器
    clearInterval(fallInterval);

    // 生成牌池：每个水果6个，总数36（3的倍数，可以全部消完）
    let bag = [];
    SYMBOLS.forEach(s=>{
      for(let i=0;i<6;i++) bag.push(s);
    })
    bag = shuffle(bag);

    tiles = [];
    tray = [];
    gameOver = false;
    messageEl.textContent = "";
    messageEl.className = "";

    let idx = 0;
    LAYER0_POS.forEach(([c,r])=>{
      tiles.push({
        id: idx,
        symbol: bag[idx++ % bag.length],
        layer:0,
        col:c, row:r, removed:false
      })
    })
    LAYER1_POS.forEach(([c,r])=>{
      tiles.push({
        id: idx,
        symbol: bag[idx++ % bag.length],
        layer:1,
        col:c, row:r, removed:false
      })
    })

    render();
    startFallingFruits();
  }

  function isClickable(tile){
    if(tile.removed) return false;
    for(const other of tiles){
      if(other.removed) continue;
      if(other.layer <= tile.layer) continue;
      if(other.col === tile.col && other.row === tile.row){
        return false;
      }
    }
    return true;
  }

  function onTileClick(tile){
    if(gameOver) return;
    if(!isClickable(tile)) return;
    tile.removed = true;
    tray.push(tile.symbol);

    // 三消逻辑
    const count = {};
    tray.forEach(s=>count[s] = (count[s]||0)+1);
    tray = [];
    Object.entries(count).forEach(([sym,num])=>{
      const keep = num % 3;
      for(let i=0;i<keep;i++) tray.push(sym);
    })
    render();
    checkWinLose();
  }

  function checkWinLose(){
    const remaining = tiles.filter(t=>!t.removed).length;
    if(remaining === 0){
      messageEl.textContent = "🎉 YOU WIN! 🎉";
      messageEl.className = "win";
      gameOver = true;
      startWinFireworks();
      return;
    }
    if(tray.length >= TRAY_MAX){
      messageEl.textContent = "💥 GAME OVER! Tray full";
      messageEl.className = "lose";
      gameOver = true;
    }
  }

  function render(){
    boardEl.innerHTML = "";
    trayEl.innerHTML = "";
    tiles.forEach(tile=>{
      const div = document.createElement('div');
      div.className = "tile";
      if(tile.removed) div.classList.add("removed");
      else if(!isClickable(tile)) div.classList.add("blocked");

      const offX = tile.layer === 1 ? 5 : 0;
      const offY = tile.layer === 1 ? 5 : 0;
      div.style.left = PAD_X + tile.col*(TILE_SIZE+GAP) + offX + "px";
      div.style.top = PAD_Y + tile.row*(TILE_SIZE+GAP) + offY + "px";
      div.style.zIndex = tile.layer * 10 + tile.id;
      div.textContent = tile.symbol;
      div.onclick = ()=>onTileClick(tile);
      boardEl.appendChild(div);
    })
    for(let i=0;i<TRAY_MAX;i++){
      const slot = document.createElement('div');
      slot.className = "tray-slot";
      slot.textContent = tray[i] ?? "";
      trayEl.appendChild(slot);
    }
  }

  function startFallingFruits(){
    fallInterval = setInterval(()=>{
      const fruit = document.createElement('div');
      fruit.className = "falling-fruit";
      fruit.textContent = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
      fruit.style.left = Math.random()*100 + "vw";
      fruit.style.animationDuration = (4 + Math.random()*4)+"s";
      fruit.style.fontSize = (36 + Math.random()*20)+"px";
      document.body.appendChild(fruit);
      setTimeout(()=>fruit.remove(),8000);
    },500);
  }

  function startWinFireworks(){
    fireworksRunning = true;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const particles = [];
    function launch(){
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.45 + 40;
      const hue = Math.random()*360;
      for(let i=0;i<90;i++){
        const ang = Math.PI*2 /90 * i;
        const spd = 2.5 + Math.random()*2;
        particles.push({
          x,y,
          vx: Math.cos(ang)*spd,
          vy: Math.sin(ang)*spd,
          life: 1,
          color: `hsl(${hue},90%,65%)`
        })
      }
    }
    let launchTimer = 0;
    function animate(){
      if(!fireworksRunning) return;
      ctx.fillStyle = "rgba(125,211,252,0.12)";
      ctx.fillRect(0,0,canvas.width,canvas.height);
      for(let i = particles.length-1; i>=0;i--){
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.life -= 0.012;
        if(p.life <= 0){
          particles.splice(i,1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(p.x,p.y,4,0,Math.PI*2);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      launchTimer++;
      if(launchTimer % 45 === 0) launch();
      requestAnimationFrame(animate);
    }
    animate();
  }

  resetBtn.onclick = initGame;
  initGame();
</script>
</body>
</html>


  initGame();
  startFallingFruits();
</script>
</body>
</html>
