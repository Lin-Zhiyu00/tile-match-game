<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tile Match Celebration</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(191, 219, 254, 0.9), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(125, 211, 252, 0.8), transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(147, 197, 253, 0.9), transparent 40%),
      linear-gradient(135deg, #7dd3fc 0%, #bae6fd 45%, #e0f2fe 100%);
    color: #0f172a;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
    z-index: 1;
  }
  h1 {
    font-size: 34px;
    letter-spacing: 8px;
    color: #0369a1;
    text-shadow:
      0 0 12px rgba(255, 255, 255, 0.9),
      0 0 24px rgba(56, 189, 248, 0.6);
    margin-bottom: 8px;
  }
  .subtitle {
    color: #075985;
    font-size: 14px;
    margin-bottom: 18px;
    opacity: 0.85;
    text-align: center;
    line-height: 1.5;
  }
  #board {
    position: relative;
    width: 460px;
    height: 370px;
    margin: 10px 0 18px;
    border-radius: 28px;
    background:
      radial-gradient(circle at center, rgba(255, 255, 255, 0.6), rgba(186, 230, 253, 0.4));
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow:
      0 20px 50px rgba(14, 116, 144, 0.25),
      inset 0 0 40px rgba(255, 255, 255, 0.7);
    overflow: hidden;
    z-index: 2;
  }
  #board::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.35) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
    pointer-events: none;
  }
  .tile {
    position: absolute;
    width: 60px;
    height: 60px;
    border-radius: 16px;
    background: linear-gradient(145deg, #ffffff 0%, #e0f2fe 50%, #7dd3fc 100%);
    border: 2px solid rgba(255, 255, 255, 0.9);
    box-shadow:
      0 10px 24px rgba(14, 116, 144, 0.35),
      0 0 0 1px rgba(255, 255, 255, 0.6) inset,
      0 6px 12px rgba(255, 255, 255, 0.8) inset;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, opacity 0.25;
    user-select: none;
  }
  .tile:hover {
    transform: translateY(-6px) scale(1.06);
    box-shadow:
      0 18px 32px rgba(14, 116, 144, 0.45),
      0 0 20px rgba(255, 255, 255, 0.9);
  }
  .tile.blocked {
    opacity: 0.35;
    cursor: not-allowed;
    filter: brightness(0.75) saturate(0.6);
  }
  .tile.removed {
    transition: all 0.35s cubic-bezier(.2,.7,.3,1);
    transform: scale(0.2) rotate(180deg);
    opacity: 0;
    pointer-events: none;
  }
  #tray {
    display: flex;
    gap: 10px;
    padding: 14px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 22px;
    min-height: 72px;
    margin: 10px 0 14px;
    box-shadow: 0 12px 30px rgba(14, 116, 144, 0.25);
    backdrop-filter: blur(8px);
    z-index: 2;
    position: relative;
  }
  .tray-slot {
    width: 60px;
    height: 60px;
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.7);
    border: 2px dashed rgba(56, 189, 248, 0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  #message {
    min-height: 34px;
    font-size: 22px;
    margin: 4px 0 14px;
    font-weight: 800;
    letter-spacing: 2px;
    text-align: center;
    z-index: 2;
    position: relative;
  }
  .win {
    color: #059669;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 24px rgba(52, 211, 153, 0.8);
  }
  .lose {
    color: #dc2626;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.9), 0 0 24px rgba(248, 113, 113, 0.8);
  }
  .controls {
    display: flex;
    gap: 14px;
    margin-top: 4px;
    position: relative;
    z-index: 10;
  }
  button {
    padding: 14px 30px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #38bdf8, #0284c7);
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 2px;
    box-shadow: 0 10px 24px rgba(14, 116, 144, 0.45);
    transition: 0.25s;
    position: relative;
    z-index: 10;
  }
  button:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 32px rgba(14, 116, 144, 0.55);
  }
  .hint {
    color: #075985;
    font-size: 13px;
    margin-top: 20px;
    opacity: 0.8;
    text-align: center;
    line-height: 1.6;
    z-index: 2;
    position: relative;
  }
  #fireworks {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* 降落水果 */
  .falling-fruit {
    position: fixed;
    top: -60px;
    font-size: 42px;
    pointer-events: none;
    z-index: 1;
    animation: fruitFall linear forwards;
    filter: drop-shadow(0 6px 10px rgba(14, 116, 144, 0.35));
  }
  @keyframes fruitFall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 1;
    }
    100% {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0.9;
    }
  }

  /* 底部弹跳水果装饰 */
  .bounce-fruit {
    position: absolute;
    bottom: 20px;
    font-size: 48px;
    animation: bounceFruit 2.4s ease-in-out infinite;
    z-index: 1;
    filter: drop-shadow(0 8px 12px rgba(14, 116, 144, 0.35));
  }
  @keyframes bounceFruit {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-18px) scale(1.08); }
  }

  .fw-particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    pointer-events: none;
    animation: fwFly 1.6s ease-out forwards;
  }
  @keyframes fwFly {
    0% {
      transform: translate(0, 0) scale(1);
      opacity: 1;
    }
    100% {
      transform: translate(var(--fw-x), var(--fw-y)) scale(0.2);
      opacity: 0;
    }
  }
</style>
</head>
<body>
  <h1>🎆 TILE MATCH 🎆</h1>
  <div class="subtitle">
    Click bright uncovered tiles → move them to the tray<br>
    Match 3 identical tiles to clear them. Clear all tiles to win!
  </div>
  <div id="board"></div>
  <div id="tray"></div>
  <div id="message"></div>
  <div class="controls">
    <button id="resetBtn">🔄 NEW GAME</button>
  </div>
  <div class="hint">
    ✨ Bright tiles are clickable · Dim tiles are covered by upper tiles<br>
    🎯 3 matching tiles in the tray will clear automatically · Tray of 7 = Game Over
  </div>

  <!-- 底部弹跳水果装饰 -->
  <div class="bounce-fruit" style="left: 8%; animation-delay: 0s;">🍎</div>
  <div class="bounce-fruit" style="right: 12%; animation-delay: 0.4s;">🍇</div>
  <div class="bounce-fruit" style="left: 30%; animation-delay: 0.8s;">🍋</div>
  <div class="bounce-fruit" style="right: 30%; animation-delay: 1.2s;">🍊</div>
  <div class="bounce-fruit" style="left: 55%; animation-delay: 1.6s;">🍉</div>
  <div class="bounce-fruit" style="right: 55%; animation-delay: 2s;">🍓</div>

  <canvas id="fireworks"></canvas>
<script>
  const SYMBOLS = ['🍎', '🍊', '🍋', '🍇', '🍉', '🍓'];
  const TILE_SIZE = 60;
  const GAP = 8;
  const TRAY_MAX = 7;

  const COLS = 5;
  const ROWS = 4;
  const GRID_W = COLS * (TILE_SIZE + GAP) - GAP;
  const GRID_H = ROWS * (TILE_SIZE + GAP) - GAP;
  const PAD_X = (460 - GRID_W) / 2;
  const PAD_Y = (370 - GRID_H) / 2;

  let tiles = [];
  let tray = [];
  let gameOver = false;
  const board = document.getElementById('board');
  const trayEl = document.getElementById('tray');
  const message = document.getElementById('message');

  const LAYER0_POS = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      LAYER0_POS.push([c, r]);
    }
  }
  const LAYER1_POS = [
    [1, 0], [2, 0], [3, 0],
    [0, 1], [2, 1], [4, 1],
    [1, 2], [2, 2], [3, 2],
    [0, 3], [2, 3], [4, 3]
  ];

  function initGame() {
    let bag = [];
    SYMBOLS.forEach(s => {
      for (let i = 0; i < 4; i++) bag.push(s);
    });
    bag.sort(() => Math.random() - 0.5);
    tiles = [];
    tray = [];
    gameOver = false;
    message.textContent = '';
    message.className = '';
    let idx = 0;
    LAYER0_POS.forEach(([c, r]) => {
      tiles.push({
        id: idx,
        symbol: bag[idx++ % bag.length],
        layer: 0,
        col: c,
        row: r,
        removed: false
      });
    });
    LAYER1_POS.forEach(([c, r]) => {
      tiles.push({
        id: idx,
        symbol: bag[idx++ % bag.length],
        layer: 1,
        col: c,
        row: r,
        removed: false
      });
    });
    render();
  }

  function isClickable(tile) {
    if (tile.removed) return false;
    for (let other of tiles) {
      if (other.removed) continue;
      if (other.layer <= tile.layer) continue;
      if (other.col === tile.col && other.row === tile.row) {
        return false;
      }
    }
    return true;
  }

  function onTileClick(tile) {
    if (gameOver) return;
    if (!isClickable(tile)) return;
    tile.removed = true;
    tray.push(tile.symbol);
    let count = {};
    tray.forEach(s => count[s] = (count[s] || 0) + 1);
    tray = [];
    Object.keys(count).forEach(s => {
      let n = count[s];
      if (n >= 3) n -= 3;
      for (let i = 0; i < n; i++) tray.push(s);
    });
    render();
    checkWinLose();
  }

  function checkWinLose() {
    let remaining = tiles.filter(t => !t.removed).length;
    if (remaining === 0) {
      message.textContent = '🎉 YOU WIN! 🎉';
      message.className = 'win';
      gameOver = true;
      startWinFireworks();
      return;
    }
    if (tray.length >= TRAY_MAX) {
      message.textContent = '💥 GAME OVER! Tray is full!';
      message.className = 'lose';
      gameOver = true;
    }
  }

  function render() {
    board.innerHTML = '';
    tiles.forEach(tile => {
      const el = document.createElement('div');
      el.className = 'tile';
      const stackOffsetX = tile.layer === 1 ? 5 : 0;
      const stackOffsetY = tile.layer === 1 ? 5 : 0;
      el.style.left = PAD_X + tile.col * (TILE_SIZE + GAP) + stackOffsetX + 'px';
      el.style.top = PAD_Y + tile.row * (TILE_SIZE + GAP) + stackOffsetY + 'px';
      el.style.zIndex = tile.layer * 10 + tile.id;
      el.textContent = tile.symbol;
      if (tile.removed) el.classList.add('removed');
      else if (!isClickable(tile)) el.classList.add('blocked');
      el.onclick = () => onTileClick(tile);
      board.appendChild(el);
    });
    trayEl.innerHTML = '';
    for (let i = 0; i < TRAY_MAX; i++) {
      const slot = document.createElement('div');
      slot.className = 'tray-slot';
      slot.textContent = tray[i] || '';
      trayEl.appendChild(slot);
    }
  }

  function clickFirework(x, y) {
    const colors = ['#f472b6', '#38bdf8', '#fde047', '#a78bfa', '#4ade80'];
    const count = 18;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'fw-particle';
      const angle = (Math.PI * 2 / count) * i;
      const dist = 60 + Math.random() * 40;
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.boxShadow = '0 0 10px ' + p.style.background;
      p.style.setProperty('--fw-x', Math.cos(angle) * dist + 'px');
      p.style.setProperty('--fw-y', Math.sin(angle) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1700);
    }
  }

  function startWinFireworks() {
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let particles = [];
    function launch() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.5 + 40;
      const color = `hsl(${Math.random() * 360}, 90%, 60%)`;
      for (let i = 0; i < 90; i++) {
        const angle = (Math.PI * 2 / 90) * i;
        const speed = 3 + Math.random() * 4;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          color
        });
      }
    }
    function animate() {
      ctx.fillStyle = 'rgba(125, 211, 252, 0.18)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.life -= 0.012;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 12;
        ctx.shadowColor = p.color;
        ctx.fill();
      });
      requestAnimationFrame(animate);
    }
    animate();
    let launches = 0;
    const timer = setInterval(() => {
      launch();
      launches++;
      if (launches >= 8) clearInterval(timer);
    }, 420);
  }

  // 水果降落动画
  function startFallingFruits() {
    setInterval(() => {
      const fruit = document.createElement('div');
      fruit.className = 'falling-fruit';
      fruit.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      fruit.style.left = Math.random() * 100 + 'vw';
      fruit.style.animationDuration = (4 + Math.random() * 4) + 's';
      fruit.style.fontSize = (30 + Math.random() * 20) + 'px';
      document.body.appendChild(fruit);
      setTimeout(() => fruit.remove(), 8000);
    }, 600);
  }

  document.getElementById('resetBtn').onclick = initGame;
  board.addEventListener('click', (e) => {
    if (e.target.classList.contains('tile') && !e.target.classList.contains('removed')) {
      const rect = board.getBoundingClientRect();
      clickFirework(e.clientX - rect.left, e.clientY - rect.top);
    }
  });

  initGame();
  startFallingFruits();
</script>
</body>
</html>
